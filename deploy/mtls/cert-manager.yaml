apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: verinode-selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: verinode-internal-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: verinode.labs
  secretName: verinode-internal-root-ca
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: verinode-selfsigned-bootstrap
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: verinode-internal-ca
spec:
  ca:
    secretName: verinode-internal-root-ca
---
# Workload certificate for verinode-backend with SPIFFE identity using the
# verinode.labs trust domain:  spiffe://verinode.labs/{service_name}/{pod_id}
# The pod_id component is resolved at admission time via the Downward API;
# the cert-manager URI SAN uses the service-account path as a stable prefix.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: verinode-backend-workload
  namespace: verinode
spec:
  secretName: verinode-backend-mtls
  duration: 24h
  renewBefore: 6h
  issuerRef:
    name: verinode-internal-ca
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  uris:
    # Primary identity: verinode.labs SPIFFE format  spiffe://verinode.labs/{service_name}/{pod_id}
    # The wildcard pod_id suffix is not supported in cert-manager URIs directly;
    # workloads use the SPIFFE Workload API (SPIRE / step-ca) to mint per-pod
    # certificates at runtime.  This static cert covers the service-level identity.
    - spiffe://verinode.labs/verinode-backend/default
    # Fallback cluster.local SPIFFE ID for mesh sidecars that use the Kubernetes
    # service-account trust domain (Istio / Linkerd).
    - spiffe://cluster.local/ns/verinode/sa/verinode-backend
